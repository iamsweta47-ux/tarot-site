# Netlify configuration for Tarot Atlas
# This is a static, drag-and-drop-ready site — no build step required.

[build]
  publish = "."

# Pretty, SEO-friendly URLs (e.g. /major-arcana/the-fool instead of .html)
[[redirects]]
  from = "/major-arcana/:card"
  to = "/major-arcana/:card.html"
  status = 200

[[redirects]]
  from = "/minor-arcana/:suit"
  to = "/minor-arcana/:suit.html"
  status = 200

# Security / caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# App (PWA + APK)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
